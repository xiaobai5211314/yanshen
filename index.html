<!DOCTYPE html>
<html lang="zh-CN" data-user-color-scheme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>纯净盐神 · 知乎盐选小说纯净阅读站</title>
  <meta name="description" content="纯净盐神 - 采用 Claude 优雅陶土主题与微软雅黑字体的知乎盐选小说纯净阅读器。零广告、零弹窗，收录 8,300+ 篇精选专栏。">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="css/style.css?v=3.1.0">
</head>
<body>

  <!-- 顶部轻量阅读进度条 -->
  <div class="progress-bar-top" id="topProgressBar"></div>

  <!-- 顶部 Claude 极简导航条 -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <div class="navbar-brand" onclick="window.app.navigate('home')">
        <div class="brand-badge">盐</div>
        <div class="brand-text">
          <span>纯净盐神</span>
          <span class="clean-pill">0 广告纯净版</span>
        </div>
      </div>

      <div class="navbar-links">
        <button class="nav-btn active" id="navHome" onclick="window.app.navigate('home')">
          <span>🏠</span> <span>主页</span>
        </button>
        <button class="nav-btn" id="navCategories" onclick="window.app.navigate('categories')">
          <span>📂</span> <span>分类</span>
        </button>
        <button class="nav-btn" id="navPresets" onclick="window.app.navigate('presets')">
          <span>🔥</span> <span>精选</span>
        </button>
        <button class="icon-btn" id="btnOpenSearch" title="全站即时搜索 (快捷键 /)">
          <span>🔍</span>
        </button>
        <button class="icon-btn" id="btnToggleTheme" title="切换暗黑/浅色模式">
          <span id="themeIcon">🌓</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- 主内容视图容器 -->
  <div class="main-wrapper" id="mainWrapper">
    <!-- 动态渲染：主页小说流 / 专栏矩阵 / 小说正文 -->
    <div style="text-align: center; padding: 60px 20px; color: var(--t3);">
      <div style="font-size: 30px; margin-bottom: 12px;">⏳</div>
      <div>正在载入专栏书库与索引...</div>
    </div>
  </div>

  <!-- Claude 浮层即时搜索模态框 -->
  <div class="claude-modal-backdrop" id="searchModal">
    <div class="claude-modal">
      <div class="claude-modal-header">
        <span style="font-size: 17px; color: var(--brand-1);">🔍</span>
        <input type="text" class="modal-search-input" id="searchInput" placeholder="搜索 8,300+ 篇小说、专栏、关键词..." autocomplete="off">
        <button class="modal-close-btn" id="btnCloseSearch">✕</button>
      </div>
      <div class="modal-search-list" id="searchResults">
        <div style="text-align: center; padding: 26px; color: var(--t3); font-size: 13.5px;">
          输入小说名或专栏关键词，即刻秒级模糊检索
        </div>
      </div>
    </div>
  </div>

  <!-- Toast 弹出提示 -->
  <div class="toast-notice" id="toastNotice"></div>

  <!-- 页脚 -->
  <footer class="site-footer">
    <div>纯净盐神 · Claude 官方雅致风格 · 全量采用微软雅黑字体 · 100% 零广告</div>
    <div style="margin-top: 6px; font-size: 12px; opacity: 0.7;">
      小说内容版权归原作者与知乎盐选所有 · 本站仅供个人阅读归档与技术交流
    </div>
  </footer>

  <script src="js/app.js?v=3.1.0"></script>
</body>
</html>
