<!DOCTYPE html>
<html lang="zh-CN" data-user-color-scheme="light">
<head>

<body>

  <!-- 顶部阅读进度条 -->
  <div class="progress-bar-top" id="topProgressBar"></div>

  <!-- 顶部导航栏 (Navbar) -->
  <nav class="navbar" id="navbar">

        </li>
        <li class="nav-item" id="navPresets">

          </a>

            <span>🔍</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-icon-btn" id="btnToggleTheme" title="切换暗黑/浅色模式">
            <span id="themeIcon">🌓</span>

        </li>
      </ul>
    </div>
  </nav>

  <!-- 顶部 Hero 大横幅 (Banner) -->
  <header class="banner" id="banner">

        <span>·</span>
        <span>离线秒开</span>
      </div>
    </div>
  </header>

  <!-- 主内容面板 (#board) -->
  <div class="board-container">
    <main class="board" id="board">
      <!-- 动态视图：文章列表 / 分类矩阵 / 正文详情 -->
      <div style="text-align: center; padding: 60px 20px; color: var(--sec-text-color);">

      <div class="search-header">
        <span style="font-size: 18px;">🔍</span>

        <button class="search-close-btn" id="btnCloseSearch">✕</button>
      </div>
      <div class="search-results-list" id="searchResults">
        <div style="text-align: center; padding: 30px; color: var(--sec-text-color); font-size: 13px;">
          输入关键词即刻搜索全站小说
        </div>
      </div>
    </div>
  </div>

  <!-- Toast 提示 -->

  <!-- 页脚 -->
  <footer class="footer">

  <script src="js/app.js?v=2.0.0"></script>

</html>
